<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="A Windows 95 desktop theme for Docsify. Folders, files, draggable windows, and iframe .exe programs."
    />
    <title>Win95 Docsify</title>
    <link rel="icon" href="theme/assets/icons/favicon.ico" />

    <!-- Docsify core theme -->
    <link rel="stylesheet" href="theme/vendor/docsify-core.min.css" />
    <!-- Win95 desktop theme -->
    <link rel="stylesheet" href="theme/win95.css" />
  </head>

  <body>
    <div id="app"></div>

    <script>
      window.$docsify = {
        name: 'Win95 Docsify',
        loadSidebar: true,
        homepage: 'README.md',
        basePath: 'docs/',
        auto2top: false,
        keyBindings: false,
        nativeEmoji: true,
        notFoundPage: '_404.md',
        win95: {
          boot: true,
          drive: 'C:',
          rootName: 'My Computer',
          startBanner: 'Windows 95',
          icons: {
            notepad: 'notepad.svg',
            browser: 'browser.svg',
          },
          desktop: [
            {
              title: 'My Computer',
              icon: 'computer',
              action: 'explorer',
            },
            {
              title: 'README.md',
              icon: 'file',
              action: 'doc',
              pathKey: '/',
            },
            {
              title: 'Notepad.exe',
              icon: 'notepad.svg',
              action: 'app',
              url: 'docs/apps/notepad.html',
              width: 620,
              height: 460,
            },
            {
              title: 'Example.com',
              icon: 'browser.svg',
              action: 'app',
              url: 'https://example.com',
            },
            {
              title: 'Recycle Bin',
              icon: 'recycle',
              action: 'recycle',
            },
            {
              title: '恐鬼症助手.exe',
              icon: 'phasmo-cheat-sheet.ico',
              action: 'app',
              url: 'https://tybayn.github.io/phasmo-cheat-sheet/?lang=zh-cn',
            }
          ],
          apps: [
            {
              title: 'Notepad',
              url: 'docs/apps/notepad.html',
              icon: 'notepad.svg',
              width: 620,
              height: 460,
            },
            {
              title: 'Example.com',
              url: 'https://example.com',
              icon: 'browser.svg',
            },
            {
              title: 'Docsify',
              url: 'https://docsify.js.org',
              icon: 'browser.svg',
            },
          ],
        },
      };
    </script>

    <!-- Docsify itself -->
    <script src="theme/vendor/docsify.min.js"></script>
    <!-- WinBox window manager -->
    <script src="theme/vendor/winbox.min.js"></script>
    <!-- Win95 theme plugin: must be registered before Docsify initializes -->
    <script src="theme/win95.js"></script>
  </body>
</html>
